<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeleleila Leila Salão de Beleiza</title>
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div class="menu__header d-flex align-items-center">
        <div class="btn-group btn-group-toggle" data-toggle="buttons">
            <label class="btn btn-secondary active">
                <input type="radio" name="opcao" id="paginaAgendar" autocomplete="off" checked> Agendar
            </label>
            <label class="btn btn-secondary">
                <input type="radio" name="opcao" id="paginaProximos" autocomplete="off"> Próximos Agendamentos
            </label>
            <label class="btn btn-secondary">
                <input type="radio" name="opcao" id="paginaHistorico" autocomplete="off"> Histórico
            </label>
        </div>
        <button type="button" class="btn btn-secondary ms-4" id="realizarLogout">Sair</button>
    </div>      
    <div class="opcoes__servicos">        
        <h3>Agende um serviço</h3>
        <div id="listagem__agendamentos__mesma__semana">          
            <!-- Lista os agendamentos encontrados na mesma semana aqui -->  
        </div>
        <p>O que gostaria de agendar?</p>
        <div id="dropdown__opcoes">
            <div >
                <select id="dropdown__opcoes--servicos" name="servico">
                    <option value="Servico">Selecione um serviço</option>
                    <!-- Opções de serviços aparecem aqui --> 
                </select>
            </div>
        </div>
        <div class="opcoes__servicos--datahora">
            <p>Escolha uma data e horário</p>
            <input type="text" id="datepicker__agendar" class="datepicker">
            <select id="horario__agendar" name="horario">
                <option value=""></option>
                <option value="08:00">08:00</option>
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>                
            </select>
        </div>
        <div class="mensagens__pendente">            
            <small class="pendente__data--erro--agendar">Inclua a nova data desejada.<br></small>
            <small class="pendente__data--incorreta--agendar">Inclua uma data como no exemplo: 01/01/2025.<br></small>      
            <small class="pendente__horario--erro--agendar">Inclua o novo horário desejado.<br></small>    
            <small class="pendente__servico">Selecione o nome do serviço.<br></small>             
        </div>        
        <small class="agendamento__sucesso">Agendamento registrado com sucesso.<br></small>   
        <button class="agendar btn btn-secondary" type="button" id="opcoes__servicos--botao--agendar">Agendar</button>
    </div>
    
</body>
<script src="node_modules/jquery/dist/jquery.min.js"></script>
<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="node_modules/jquery-ui/ui/widgets/datepicker.js"></script>
<script src="src/js/i18n/jquery.ui.datepicker-pt-BR.js"></script>
<script src="./script/renderer.js"></script>
</html>
