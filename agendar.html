<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeleleila Leila Salão de Beleiza</title>
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div class="menu__header">
        <div class="btn-group btn-group-toggle" data-toggle="buttons">
            <label class="btn btn-secondary active">
                <input type="radio" name="opcao" id="paginaAgendar" autocomplete="off" checked> Agendar
            </label>
            <label class="btn btn-secondary">
                <input type="radio" name="opcao" id="paginaProximos" autocomplete="off"> Próximos Agendamentos
            </label>
            <label class="btn btn-secondary">
                <input type="radio" name="opcao" id="paginaHistorico" autocomplete="off"> Histórico
            </label>
        </div>
    </div>  
    
    <div class="opcoes__servicos">
        <h3>Agende um serviço</h3>
        <p>Escolha um ou mais de nossos serviços</p>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="corte__feminino">
            <label class="custom-control-label" for="corte__feminino">Corte de Cabelo Feminino</label>
        </div>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="corte__masculino">
            <label class="custom-control-label" for="corte__masculino">Corte de Cabelo Masculino</label>
        </div>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="tintura">
            <label class="custom-control-label" for="tintura">Tintura</label>
        </div>
        <div class="opcoes__servicos--corte__feminino">
            <p>Escolha um horário para o Corte Feminino</p>
            <input type="text" id="datepickerfeminino" class="datepicker">
            <input type="time" class="escolha__horario" id="horariofeminino" name="horario" min="08:00" max="18:00">
        </div>
        <div class="opcoes__servicos--corte__masculino">
            <p>Escolha um horário para o Corte Masculino</p>
            <input type="text" id="datepickermasculino" class="datepicker">
            <input type="time" class="escolha__horario" id="horariomasculino" name="horario" min="09:00" max="18:00">
            
        </div>
        <div class="opcoes__servicos--tintura">
            <p>Escolha um horário para a Tintura</p>
            <input type="text" id="datepickertintura" class="datepicker">
            <input type="time" class="escolha__horario" id="horariotintura" name="horario" min="09:00" max="18:00">
        </div>
        <small class="horario__incorreto">Por favor selecione um horário dentro do período das 08h às 18h.</small>
        <br>
        <button type="button" class="btn btn-outline-dark">Agendar</button>
    </div>
    
</body>
<script src="node_modules/jquery/dist/jquery.min.js"></script>
<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="node_modules/jquery-ui/ui/widgets/datepicker.js"></script>
<script src="src/js/i18n/jquery.ui.datepicker-pt-BR.js"></script>
<script src="./script/renderer.js"></script>
</html>
