<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeleleila Leila Salão de Beleiza</title>
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div class="menu__header">
        <div class="btn-group btn-group-toggle" data-toggle="buttons">
            <label class="btn btn-secondary">
                <input type="radio" name="opcao" id="paginaAgendar" autocomplete="off"> Agendar
            </label>
            <label class="btn btn-secondary">
                <input type="radio" name="opcao" id="paginaProximos" autocomplete="off"> Próximos Agendamentos
            </label>
            <label class="btn btn-secondary">
                <input type="radio" name="opcao" id="paginaHistorico" autocomplete="off"> Histórico
            </label>
        </div>
    </div>  
    
    <div class="opcoes__servicos">        
        <h3>Editando agendamento</h3>
        <div id="listagem__agendamentos__mesma__semana">          
            <!-- Lista os agendamentos encontrados na mesma semana aqui -->  
        </div>
        <!-- <p>Escolha um ou mais de nossos serviços</p>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="corte__feminino">
            <label class="custom-control-label" for="corte__feminino">Corte de Cabelo Feminino</label>
        </div>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="corte__masculino">
            <label class="custom-control-label" for="corte__masculino">Corte de Cabelo Masculino</label>
        </div>
        <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="tintura">
            <label class="custom-control-label" for="tintura">Tintura</label>
        </div> -->
        <div class="opcoes__servicos--datahora">
            <p>Escolha um novo horário</p>
            <input type="text" id="datepickerEdicao" class="datepicker">
            <select id="horario__edicao" name="horario">
                <option value=""></option>
                <option value="08:00">08:00</option>
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>                
            </select>
        </div>
        <div>
            <p>Selecione o serviço</p>
            <select id="opcao__servico--edicao" name="servico">
                <option value=""></option>
                <option value="Corte Feminino">Corte Feminino</option>
                <option value="Corte Masculino">Corte Masculino</option>
                <option value="Tintura">Tintura</option>              
            </select>
        </div>
        <div class="mensagens__pendente">            
            <small class="pendente__data--erro">Inclua a nova data desejada.<br></small>     
            <small class="pendente__horario--erro">Inclua o novo horário desejado.<br></small>    
            <small class="pendente__servico">Selecione o nome do serviço.<br></small> 
        </div>            
        <small class="agendamento__sucesso">Agendamento editado com sucesso.<br></small>   
        <button class="editar__agendamento btn btn-secondary" type="button" id="botao__salvar__agendamento">Salvar</button>
        <button class="cancelar__agendamento btn btn-secondary" type="button" id="botao__cancelar__agendamento">Cancelar</button>
    </div>
    
</body>
<script src="node_modules/jquery/dist/jquery.min.js"></script>
<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="node_modules/jquery-ui/ui/widgets/datepicker.js"></script>
<script src="src/js/i18n/jquery.ui.datepicker-pt-BR.js"></script>
<script src="./script/renderer.js"></script>
</html>
